name: webtech-jenkins
services:
  jenkins:
    build:
      context: .
    image: webtech-jenkins:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m"
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
volumes:
  jenkins_home:

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  batch:
    timeout: 5s
    send_batch_size: 256
exporters:
  prometheusremotewrite:
    endpoint: ${env:METRICS_REMOTE_WRITE_URL}
    headers:
      Authorization: ${env:METRICS_AUTHORIZATION}
    tls:
      ca_pem: ${env:TELEMETRY_CA_PEM}
    resource_to_telemetry_conversion:
      enabled: true
    external_labels:
      environment: production
      service: backend
    remote_write_queue:
      enabled: true
      queue_size: 1000
      num_consumers: 1
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
  otlphttp/tempo:
    endpoint: ${env:TEMPO_OTLP_HTTP_URL}
    headers:
      Authorization: ${env:TEMPO_AUTHORIZATION}
    tls:
      ca_pem: ${env:TELEMETRY_CA_PEM}
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 60s
service:
  telemetry:
    logs:
      level: warn
      encoding: json
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]

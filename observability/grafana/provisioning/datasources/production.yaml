apiVersion: 1
datasources:
  - name: Production metrics
    uid: production-metrics
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_QUERY_URL}
    isDefault: true
    editable: false
  - name: Production traces
    uid: production-tempo
    type: tempo
    access: proxy
    url: ${TEMPO_QUERY_URL}
    editable: false
  - name: Production CloudWatch
    uid: production-cloudwatch
    type: cloudwatch
    jsonData:
      authType: default
      defaultRegion: eu-west-2
      logsTimeout: 30s
    editable: false

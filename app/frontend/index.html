<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact WebTech Technologies for an enquiry.">
  <title>WebTech Technologies | Enquiry</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); background: white; border-radius: 16px; padding: 36px; box-shadow: 0 12px 40px #17203318; }
    .brand { color: #1769aa; font-size: .9rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 6vw, 2.8rem); }
    p { color: #566176; line-height: 1.6; }
    label { display: block; margin: 20px 0 8px; font-weight: 700; }
    input { width: 100%; border: 1px solid #cbd3df; border-radius: 8px; padding: 13px 14px; font: inherit; }
    input:focus { outline: 3px solid #1769aa33; border-color: #1769aa; }
    button { width: 100%; margin-top: 24px; border: 0; border-radius: 8px; background: #1769aa; color: white; padding: 14px; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <div class="brand">WebTech Technologies</div>
    <h1>Let’s talk</h1>
    <p>Leave your details and our team will get in touch.</p>
    <form id="enquiry-form">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" minlength="2" maxlength="120" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <button id="submit-button" type="submit">Send enquiry</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#enquiry-form');
    const message = document.querySelector('#message');
    const button = document.querySelector('#submit-button');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = 'Sending…';
      const data = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch('/api/enquiries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Please check your details and try again.');
        message.textContent = result.message;
        form.reset();
      } catch (error) {
        message.textContent = error.message || 'Could not send your enquiry. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>

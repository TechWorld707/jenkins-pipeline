name: WebTech CI and security scans

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stack:
        description: Infrastructure to plan and request approval for
        type: choice
        default: all
        options: [all, shared, staging, production]

permissions:
  contents: read

jobs:
  app-lint:
    name: Lint application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint Python backend
        run: ruff check .

      - name: Install backend test dependencies
        run: python -m pip install -r app/backend/requirements.txt

      - name: Test image publication gates and database configuration
        run: python -m unittest discover -s ci -p 'test_*.py'

      - name: Check Python syntax
        if: ${{ hashFiles('app/backend/**/*.py') != '' }}
        run: python -m compileall -q app/backend

      - name: Check Docker Compose configuration
        if: ${{ hashFiles('app/docker-compose.yml') != '' }}
        run: docker compose -f app/docker-compose.yml config --quiet

      - name: Explain why Docker Compose validation was skipped
        if: ${{ hashFiles('app/docker-compose.yml') == '' }}
        run: echo "Docker Compose validation was skipped because app/docker-compose.yml is absent from this checkout. Commit and push the app files to enable validation."

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Create a SARIF report so findings can appear in GitHub code scanning.
      - name: Scan and create SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Create Trivy HTML and table reports
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        run: |
          python3 - <<'PYREPORT'
          import html
          import json
          import os
          import re
          from pathlib import Path

          def cell(value):
              return html.escape(str(value)).replace("|", "&#124;").replace("\r", " ").replace("\n", " ")

          report = json.loads(Path("trivy-results.sarif").read_text())
          rows = []
          blocking = 0
          for run in report.get("runs", []):
              rules = {rule["id"]: rule for rule in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  locations = result.get("locations") or [{}]
                  location = locations[0].get("physicalLocation", {})
                  target = location.get("artifactLocation", {}).get("uri", "N/A")
                  line = location.get("region", {}).get("startLine", "—")
                  message = result.get("message", {}).get("text", "")
                  rule = rules.get(result.get("ruleId"), {})
                  tags = rule.get("properties", {}).get("tags", [])
                  severity = next((tag.upper() for tag in tags if tag.upper() in {"UNKNOWN", "LOW", "MEDIUM", "HIGH", "CRITICAL"}), None)
                  if severity is None:
                      match = re.search(r"Severity:\s*(UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL)\b", message)
                      if not match:
                          raise ValueError("Cannot determine Trivy finding severity")
                      severity = match.group(1)
                  blocking += severity in {"HIGH", "CRITICAL"}
                  rows.append([severity, result.get("ruleId", "N/A"), target, line, message])

          Path("trivy-gate.json").write_text(json.dumps({"blocking": blocking}))

          intro = ("## Trivy security scan\n\n"
                   "| Check | Result |\n| --- | --- |\n"
                   f"| Scan status | {'FAILED' if blocking else 'PASSED'} |\n"
                   f"| Total reported findings | {len(rows)} |\n"
                   f"| Blocking HIGH/CRITICAL findings | {blocking} |\n"
                   "| Failure threshold | HIGH, CRITICAL |\n"
                   "| Scanners | Vulnerabilities, misconfigurations, secrets |\n"
                   "| Unfixed vulnerabilities | Excluded |\n\n"
                   "### Findings\n\n")

          def table(limit):
              if not rows:
                  return "No findings reported.\n"
              lines = ["| Severity | Rule | File | Line | Finding |", "| --- | --- | --- | --- | --- |"]
              lines.extend("| " + " | ".join(map(cell, row)) + " |" for row in rows[:limit])
              return "\n".join(lines) + "\n"

          Path("trivy-report.md").write_text(intro + table(len(rows)))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(intro + table(100))
              if len(rows) > 100:
                  summary.write("\nShowing the first 100 findings.\n")
              summary.write("\nDownload and extract the **trivy-sarif-report** artifact, then open **trivy-report.html** in your browser for the colourful report. Markdown and SARIF data are also included.\n")
          PYREPORT
          python3 .github/scripts/render_report.py trivy-report.md

      - name: Upload Trivy findings to GitHub code scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Save Trivy HTML, Markdown and SARIF reports
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-report
          path: |
            trivy-results.sarif
            trivy-report.md
            trivy-report.html
            trivy-gate.json
          retention-days: 7

      # Use the same severity counts as the report, rather than rescanning.
      - name: Fail if HIGH or CRITICAL findings exist
        if: ${{ always() }}
        run: |
          python3 - <<'PYGATE'
          import json
          from pathlib import Path

          path = Path("trivy-gate.json")
          if not path.exists():
              raise SystemExit("::error::Trivy did not produce a valid security gate result.")
          count = json.loads(path.read_text())["blocking"]
          if count:
              raise SystemExit(f"::error::Trivy found {count} HIGH/CRITICAL findings. See the HTML report.")
          print("Trivy gate passed: no HIGH/CRITICAL findings.")
          PYGATE

  checkov:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # hashFiles belongs on a step, after the repository has been checked out.
      - name: Scan Terraform files with Checkov
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') != '' }}
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif

      - name: Upload Checkov findings to GitHub code scanning
        if: ${{ always() && hashFiles('checkov-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif

      - name: Save Checkov report as an artifact
        if: ${{ always() && hashFiles('checkov-results.sarif') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: checkov-sarif-report
          path: checkov-results.sarif
          retention-days: 7

      - name: Explain why Checkov was skipped
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') == '' }}
        run: echo "Checkov was skipped because infra/terraform does not contain Terraform files yet."

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_HOST_URL: http://127.0.0.1:9000
      SONAR_PROJECT_KEY: webtech
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Disposable evaluation server: no persistent database or credentials.
      - name: Start temporary SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072
          mkdir -p sonar-reports
          docker run -d --name sonarqube-ci \
            --publish 127.0.0.1:9000:9000 \
            --ulimit nofile=131072:131072 \
            --ulimit nproc=8192:8192 \
            sonarqube:community
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 5 "$SONAR_HOST_URL/api/system/status" | jq -e '.status == "UP"' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SonarQube did not become ready within the startup timeout."
          exit 1

      - name: Create temporary credentials and project
        id: sonar-setup
        run: |
          sonar_password="Aa1!$(openssl rand -hex 24)"
          echo "::add-mask::$sonar_password"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -u admin:admin -X POST "$SONAR_HOST_URL/api/users/change_password" \
            --data-urlencode login=admin \
            --data-urlencode previousPassword=admin \
            --data-urlencode "password=$sonar_password"
          token_response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -u "admin:$sonar_password" -X POST "$SONAR_HOST_URL/api/user_tokens/generate" \
            --data-urlencode name=github-actions)"
          sonar_token="$(jq -er '.token' <<< "$token_response")"
          echo "::add-mask::$sonar_token"
          echo "SONAR_TOKEN=$sonar_token" >> "$GITHUB_ENV"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -u "$sonar_token:" -X POST "$SONAR_HOST_URL/api/projects/create" \
            --data-urlencode "project=$SONAR_PROJECT_KEY" \
            --data-urlencode name=WebTech > /dev/null

      # Only pass Sonar credentials into the scanner container. Each run scans
      # its checked-out code as a fresh project, without PR/branch auto-detection.
      - name: Scan code and wait for the quality gate
        run: |
          set -o pipefail
          mkdir -p sonar-reports
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env SONAR_HOST_URL --env SONAR_TOKEN \
            --env SONAR_USER_HOME=/tmp/sonar \
            --volume "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            -Dsonar.sources=app \
            -Dsonar.working.directory=/tmp/sonar-work \
            -Dsonar.python.version=3.12 \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            2>&1 | tee sonar-reports/scanner.log

      - name: Export SonarQube results
        if: ${{ always() && steps.sonar-setup.outcome == 'success' }}
        run: |
          mkdir -p sonar-reports
          curl --fail-with-body --silent --show-error --max-time 30 \
            -u "$SONAR_TOKEN:" --get "$SONAR_HOST_URL/api/qualitygates/project_status" \
            --data-urlencode "projectKey=$SONAR_PROJECT_KEY" \
            --output sonar-reports/quality-gate.json
          curl --fail-with-body --silent --show-error --max-time 30 \
            -u "$SONAR_TOKEN:" --get "$SONAR_HOST_URL/api/measures/component" \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,coverage,duplicated_lines_density \
            --output sonar-reports/measures.json
          # Preserve every page of issues rather than just the first 100.
          page=1
          while true; do
            report="sonar-reports/issues-$page.json"
            curl --fail-with-body --silent --show-error --max-time 30 \
              -u "$SONAR_TOKEN:" --get "$SONAR_HOST_URL/api/issues/search" \
              --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
              --data-urlencode ps=500 --data-urlencode "p=$page" \
              --output "$report"
            total="$(jq -er '.paging.total' "$report")"
            if [ "$((page * 500))" -ge "$total" ]; then break; fi
            page=$((page + 1))
          done
          python3 - <<'PYREPORT'
          import html
          import json
          import os
          from pathlib import Path

          reports = Path("sonar-reports")
          def load(name):
              return json.loads((reports / name).read_text())

          def cell(value):
              return html.escape(str(value)).replace("|", "&#124;").replace("\r", " ").replace("\n", " ")

          def table(headers, rows):
              return "\n".join([
                  "| " + " | ".join(map(cell, headers)) + " |",
                  "| " + " | ".join("---" for _ in headers) + " |",
                  *["| " + " | ".join(map(cell, row)) + " |" for row in rows],
              ])

          gate = load("quality-gate.json")["projectStatus"]
          measures = {item["metric"]: item.get("value", "N/A")
                      for item in load("measures.json")["component"]["measures"]}
          metrics = [
              ("Bugs", "bugs"), ("Vulnerabilities", "vulnerabilities"),
              ("Code smells", "code_smells"), ("Security hotspots", "security_hotspots"),
              ("Coverage (%)", "coverage"), ("Duplicated lines (%)", "duplicated_lines_density"),
          ]
          issues = []
          for path in sorted(reports.glob("issues-*.json")):
              issues.extend(json.loads(path.read_text()).get("issues", []))
          rows = [[item.get("severity", "N/A"), item.get("type", "N/A"),
                   item.get("component", "").removeprefix(os.environ["SONAR_PROJECT_KEY"] + ":"),
                   item.get("line", "—"), item.get("message", "")]
                  for item in issues]
          intro = "## SonarQube analysis\n\n" + table(
              ["Check", "Result"], [["Quality gate", gate["status"]], ["Issues", len(issues)]])
          intro += "\n\n### Metrics\n\n" + table(
              ["Metric", "Value"], [[label, measures.get(key, "N/A")] for label, key in metrics])
          if gate.get("conditions"):
              intro += "\n\n### Quality gate conditions\n\n" + table(
                  ["Metric", "Status", "Actual", "Comparator", "Threshold"],
                  [[c["metricKey"], c["status"], c.get("actualValue", "N/A"),
                    c.get("comparator", ""), c.get("errorThreshold", "N/A")]
                   for c in gate["conditions"]])

          def findings(limit):
              if not rows:
                  return "\n\n### Issues\n\nNo issues reported."
              return "\n\n### Issues\n\n" + table(
                  ["Severity", "Type", "File", "Line", "Message"], rows[:limit])

          footer = ("\n\nDownload the **sonar-reports** artifact for the complete report and JSON data. "
                    "The temporary server is removed after this job; no dashboard or history is retained.\n")
          (reports / "report.md").write_text(intro + findings(len(rows)) + footer)
          summary = intro + findings(100)
          if len(rows) > 100:
              summary += "\n\nShowing the first 100 issues; see report.md in the artifact for all issues."
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + footer)
          PYREPORT
          python3 .github/scripts/render_report.py sonar-reports/report.md

      - name: Collect server logs and discard temporary SonarQube
        if: ${{ always() }}
        run: |
          mkdir -p sonar-reports
          docker logs sonarqube-ci > sonar-reports/server.log 2>&1 || true
          docker rm --force --volumes sonarqube-ci

      - name: Save SonarQube reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sonar-reports
          path: sonar-reports/
          retention-days: 7

  terraform-checks:
    name: Terraform format, validate and TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Check Terraform formatting
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') != '' }}
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialise Terraform without the remote backend
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') != '' }}
        run: |
          for root in bootstrap shared environments/staging environments/production; do
            terraform -chdir="infra/terraform/$root" init -backend=false -input=false -lockfile=readonly
          done

      - name: Validate Terraform configuration
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') != '' }}
        run: |
          for root in bootstrap shared environments/staging environments/production; do
            terraform -chdir="infra/terraform/$root" validate
          done

      - name: Test idle ECS provisioning with mocked AWS
        run: |
          test_root="$RUNNER_TEMP/ecs-approval-tests"
          mkdir -p "$test_root"
          cp -R infra/terraform/modules/ecs/. "$test_root/"
          cp infra/terraform/environments/staging/.terraform.lock.hcl "$test_root/"
          terraform -chdir="$test_root" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="$test_root" test -no-color

      - name: Initialise TFLint
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') != '' }}
        run: |
          for root in shared environments/staging environments/production; do
            tflint --chdir="infra/terraform/$root" --init
          done

      - name: Run TFLint and create SARIF report
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') != '' }}
        run: |
          tflint --chdir=infra/terraform/shared --format=sarif > tflint-results.sarif
          for root in environments/staging environments/production; do
            tflint --chdir="infra/terraform/$root" --call-module-type=local
          done

      - name: Upload TFLint findings to GitHub code scanning
        if: ${{ always() && hashFiles('tflint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tflint-results.sarif

      - name: Save TFLint report as an artifact
        if: ${{ always() && hashFiles('tflint-results.sarif') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: tflint-sarif-report
          path: tflint-results.sarif
          retention-days: 7

      - name: Explain why Terraform checks were skipped
        if: ${{ hashFiles('infra/terraform/*.tf', 'infra/terraform/**/*.tf') == '' }}
        run: echo "Terraform checks were skipped because infra/terraform does not contain Terraform files yet."

  terraform-shared:
    name: shared infrastructure
    needs: [app-lint, trivy, checkov, sonarqube, terraform-checks]
    # Plans never receive fork PR credentials; applies require main and approval.
    if: ${{ vars.TF_PLAN_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.stack == 'all' || inputs.stack == 'shared') }}
    concurrency:
      group: terraform-shared-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: shared
      enabled: true
    secrets: inherit

  terraform-staging:
    name: staging infrastructure
    needs: [app-lint, trivy, checkov, sonarqube, terraform-checks]
    # Plans never receive fork PR credentials; applies require main and approval.
    if: ${{ vars.TF_PLAN_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.stack == 'all' || inputs.stack == 'staging') }}
    concurrency:
      group: terraform-staging-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: staging
      enabled: ${{ vars.TF_STAGING_ENABLED == 'true' }}
    secrets: inherit

  terraform-production:
    name: production infrastructure
    needs: [app-lint, trivy, checkov, sonarqube, terraform-checks]
    # Plans never receive fork PR credentials; applies require main and approval.
    if: ${{ vars.TF_PLAN_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.stack == 'all' || inputs.stack == 'production') }}
    concurrency:
      group: terraform-production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: production
      enabled: ${{ vars.TF_PRODUCTION_ENABLED == 'true' }}
    secrets: inherit
